name: Update profile visuals

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create asset folders
        run: mkdir -p assets profile

      - name: Generate profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: yatoragami
          cards: overview,momentum,contributions
          output-dir: assets
          themes: dark
          palette: green
          commit: false

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: yatoragami
          outputs: profile/github-snake.svg?palette=github-dark

      - name: Save generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg profile/github-snake.svg
          git commit -m "Update profile visuals" || exit 0
          git push
